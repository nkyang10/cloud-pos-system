name: Feature proposal
description: Propose a new feature or refinement (engine also files these per cycle)
labels: ["enhancement"]
body:
- type: markdown
  attributes:
    value: |
      Please keep the title self-describing (what it is, what it relates to).
- type: textarea
  attributes:
    label: What & why
  validations:
    required: true
- type: textarea
  attributes:
    label: Acceptance criteria
  validations:
    required: false
